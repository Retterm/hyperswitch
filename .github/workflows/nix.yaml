name: "CI Nix"
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  nix-ci:
    runs-on: ${{ fromJSON(vars.RETTERM_ISOLATED_CI == '1' && matrix.system == 'x86_64-linux' && '["self-hosted","linux","x64","retterm-hk-ci-isolated"]' || toJSON(matrix.system)) }}
    permissions:
      contents: read
    strategy:
      matrix:
        system: [x86_64-linux, aarch64-darwin]
    steps:
      - uses: actions/checkout@v4
      - run: om ci run --extra-access-tokens ${{ secrets.GITHUB_TOKEN }} --systems "${{ matrix.system }}"
